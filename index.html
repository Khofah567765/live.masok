<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SportStream — Live Sports</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.12/hls.min.js"></script>
<style>
:root {
  --red:#E8001D; --red-dim:rgba(232,0,29,.18);
  --black:#090909; --dark:#111; --card:#181818; --card2:#202020;
  --border:rgba(255,255,255,.07); --text:#F2F2F2; --muted:#777;
  --gold:#FFD700; --green:#22c55e; --blue:#3b82f6;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--black);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh;overflow-x:hidden}

/* ── HEADER ── */
header{background:rgba(9,9,9,.97);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);
  padding:0 1.5rem;height:58px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:200}
.logo{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.7rem;letter-spacing:-.5px}
.logo em{color:var(--red);font-style:normal}
.hdr-right{display:flex;align-items:center;gap:14px}
.live-pill{display:flex;align-items:center;gap:5px;background:var(--red);color:#fff;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.72rem;letter-spacing:1.5px;
  padding:4px 10px;border-radius:2px}
.dot-anim{width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1.1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.hdr-count{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.8rem;color:var(--muted)}
.hdr-count span{color:var(--text)}

/* ── LAYOUT ── */
.layout{display:grid;grid-template-columns:1fr 340px;min-height:calc(100vh - 58px)}

/* ── PLAYER SECTION ── */
.player-sec{padding:1.25rem;border-right:1px solid var(--border)}

.player-wrap{position:relative;background:#000;border-radius:6px;overflow:hidden;
  aspect-ratio:16/9;max-height:520px}
#vid{width:100%;height:100%;display:block;background:#000}

/* placeholder */
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;background:#080808}
.ph-play{width:68px;height:68px;border-radius:50%;background:rgba(232,0,29,.12);
  border:2px solid var(--red);display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:.2s}
.ph-play:hover{background:rgba(232,0,29,.25);transform:scale(1.06)}
.ph-play svg{width:28px;height:28px;fill:var(--red);margin-left:4px}
.ph-txt{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.9rem;
  color:var(--muted);letter-spacing:1px;text-align:center;padding:0 1rem}
.spin{width:36px;height:36px;border:3px solid rgba(255,255,255,.08);
  border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite;display:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* error */
.err-overlay{position:absolute;inset:0;display:none;flex-direction:column;
  align-items:center;justify-content:center;background:rgba(0,0,0,.93);gap:8px}
.err-ico{font-size:2.2rem}
.err-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.3rem;color:var(--red)}
.err-sub{font-size:.82rem;color:var(--muted);text-align:center;max-width:260px;line-height:1.5}

/* controls */
.ctrl-overlay{position:absolute;bottom:0;left:0;right:0;
  background:linear-gradient(transparent,rgba(0,0,0,.88));
  padding:1.8rem 1rem .9rem;opacity:0;transition:.25s}
.player-wrap:hover .ctrl-overlay{opacity:1}
.prog{width:100%;height:3px;background:rgba(255,255,255,.18);border-radius:2px;
  margin-bottom:9px;cursor:pointer;position:relative}
.prog-fill{height:100%;background:var(--red);border-radius:2px;width:0%;pointer-events:none;transition:width .4s linear}
.ctrl-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#fff;
  width:34px;height:34px;border-radius:4px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;transition:.15s;flex-shrink:0}
.cbtn:hover{background:rgba(255,255,255,.22)}
.cbtn svg{width:15px;height:15px;fill:currentColor}
.vslider{width:70px;height:3px;accent-color:var(--red);cursor:pointer}
.time-txt{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:.75rem;
  color:rgba(255,255,255,.65);letter-spacing:.5px;white-space:nowrap}
.rsel{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;
  height:34px;padding:0 8px;border-radius:4px;font-family:'Barlow Condensed',sans-serif;
  font-weight:700;font-size:.75rem;letter-spacing:.5px;cursor:pointer;outline:none}
.rsel option{background:#222;color:#fff}
.lang-sel{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;
  height:34px;padding:0 8px;border-radius:4px;font-family:'Barlow Condensed',sans-serif;
  font-weight:600;font-size:.75rem;cursor:pointer;outline:none;max-width:90px}
.lang-sel option{background:#222;color:#fff}

/* channel info */
.ch-info-bar{display:flex;align-items:flex-start;gap:14px;padding:1.1rem 0 0}
.match-logo{display:flex;align-items:center;gap:10px}
.team-logo{width:42px;height:42px;border-radius:6px;background:var(--card2);
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
  font-size:1.4rem;overflow:hidden;flex-shrink:0}
.team-logo img{width:100%;height:100%;object-fit:contain;padding:4px}
.vs-txt{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1rem;
  color:var(--muted)}
.ch-meta{flex:1;min-width:0}
.ch-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.5rem;
  line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-sub{color:var(--muted);font-size:.85rem;margin-top:3px}
.tag-row{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.tag{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.68rem;
  letter-spacing:.7px;padding:3px 8px;border-radius:2px;text-transform:uppercase;border:1px solid}
.tag.live{color:var(--red);border-color:rgba(232,0,29,.4);background:rgba(232,0,29,.1)}
.tag.cat{color:#aaa;border-color:rgba(255,255,255,.15);background:rgba(255,255,255,.05)}
.tag.hls{color:#60a5fa;border-color:rgba(96,165,250,.35);background:rgba(96,165,250,.08)}
.tag.wib{color:var(--gold);border-color:rgba(255,215,0,.3);background:rgba(255,215,0,.07)}

/* DRM panel */
.drm-panel{margin-top:1.2rem;background:var(--card);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.drm-head{padding:8px 14px;background:var(--card2);border-bottom:1px solid var(--border);
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.78rem;
  letter-spacing:1px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:7px}
.drm-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.drm-cell{padding:10px 14px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);font-size:.8rem}
.drm-cell:nth-child(2n){border-right:none}
.drm-cell:nth-last-child(-n+2){border-bottom:none}
.drm-lbl{color:var(--muted);font-size:.72rem;margin-bottom:3px}
.drm-val{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.85rem;
  display:flex;align-items:center;gap:5px}
.sd{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
.sd.off{background:#444}

/* ── SIDEBAR ── */
.sidebar{display:flex;flex-direction:column;height:calc(100vh - 58px);
  position:sticky;top:58px;overflow:hidden}
.sb-head{padding:1rem 1rem .75rem;border-bottom:1px solid var(--border);flex-shrink:0}
.sb-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1rem;
  letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.sbox{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);
  padding:7px 11px;border-radius:4px;font-size:.83rem;outline:none;font-family:'Barlow',sans-serif}
.sbox::placeholder{color:var(--muted)}
.sbox:focus{border-color:rgba(232,0,29,.5)}
.ftabs{display:flex;gap:5px;padding:.65rem 1rem;border-bottom:1px solid var(--border);
  flex-wrap:wrap;flex-shrink:0}
.ftab{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.7rem;
  letter-spacing:.5px;padding:4px 9px;border-radius:2px;cursor:pointer;
  border:1px solid var(--border);background:transparent;color:var(--muted);transition:.15s}
.ftab:hover{color:var(--text);border-color:rgba(255,255,255,.2)}
.ftab.on{background:var(--red);border-color:var(--red);color:#fff}

/* channel list */
.ch-list{flex:1;overflow-y:auto;padding:.4rem 0}
.ch-list::-webkit-scrollbar{width:2px}
.ch-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:2px}
.ch-card{display:flex;align-items:center;gap:11px;padding:10px 1rem;cursor:pointer;
  border-left:3px solid transparent;transition:.15s}
.ch-card:hover{background:rgba(255,255,255,.04)}
.ch-card.on{background:rgba(232,0,29,.07);border-left-color:var(--red)}
.ch-logos{display:flex;align-items:center;gap:4px;flex-shrink:0}
.sm-logo{width:36px;height:36px;border-radius:5px;background:var(--card2);
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;overflow:hidden}
.sm-logo img{width:100%;height:100%;object-fit:contain;padding:3px}
.vs-sm{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:.65rem;color:var(--muted)}
.ch-body{flex:1;min-width:0}
.ch-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.92rem;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.ch-cat{font-size:.72rem;color:var(--muted);margin-top:1px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.ch-right{text-align:right;flex-shrink:0}
.ch-time{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.88rem}
.live-ind{display:inline-flex;align-items:center;gap:3px;font-family:'Barlow Condensed',sans-serif;
  font-weight:700;font-size:.6rem;letter-spacing:.7px;color:var(--red);margin-top:2px}
.ld{width:4px;height:4px;border-radius:50%;background:var(--red);animation:blink 1.1s infinite}
.upcoming-lbl{font-size:.65rem;color:var(--muted);margin-top:2px}

/* loading / empty */
.loading-state{padding:2.5rem;text-align:center;color:var(--muted);
  font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:1px;font-size:.85rem}
.empty{padding:2rem;text-align:center;color:var(--muted);font-size:.85rem}

/* toast */
.toast{position:fixed;bottom:22px;right:22px;background:var(--card2);
  border:1px solid var(--border);border-left:3px solid var(--red);
  padding:10px 14px;border-radius:4px;font-size:.82rem;color:var(--text);
  transform:translateX(130%);transition:transform .28s ease;z-index:999;max-width:280px}
.toast.show{transform:translateX(0)}

/* cat colors */
.cat-Football{color:#22c55e}
.cat-Basketball{color:#f97316}
.cat-Tennis{color:#eab308}
.cat-Cricket{color:#a78bfa}
.cat-Motor{color:#e8001d}
.cat-default{color:#60a5fa}

@media(max-width:1050px){
  .layout{grid-template-columns:1fr}
  .sidebar{position:static;height:auto;max-height:380px;border-top:1px solid var(--border)}
}
@media(max-width:600px){
  header{padding:0 1rem}
  .player-sec{padding:.75rem}
}
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">SPORT<em>STREAM</em></div>
  <div class="hdr-right">
    <div class="hdr-count">Siaran: <span id="totalCount">—</span></div>
    <div class="live-pill"><div class="dot-anim"></div>LIVE</div>
  </div>
</header>

<div class="layout">

<!-- ── PLAYER ── -->
<section class="player-sec">

  <div class="player-wrap" id="pw">
    <video id="vid" playsinline></video>

    <!-- placeholder -->
    <div class="ph" id="ph">
      <div class="spin" id="spin"></div>
      <div class="ph-play" id="phBtn" onclick="playSelected()">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>
      <p class="ph-txt" id="phTxt">PILIH PERTANDINGAN UNTUK MULAI</p>
    </div>

    <!-- error -->
    <div class="err-overlay" id="errOv">
      <div class="err-ico">⚠️</div>
      <div class="err-title">STREAM ERROR</div>
      <div class="err-sub" id="errSub">Tidak dapat memuat stream ini.</div>
    </div>

    <!-- controls -->
    <div class="ctrl-overlay" id="ctrlOv">
      <div class="prog" onclick="seekVid(event)"><div class="prog-fill" id="pf"></div></div>
      <div class="ctrl-row">
        <!-- play/pause -->
        <button class="cbtn" onclick="togglePlay()" id="ppBtn">
          <svg id="ppIco" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <!-- mute -->
        <button class="cbtn" onclick="toggleMute()" id="muteBtn">
          <svg id="volIco" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
        </button>
        <input type="range" class="vslider" id="vs" min="0" max="100" value="80" oninput="setVol(this.value)">
        <span class="time-txt" id="timeTxt">LIVE</span>
        <div style="flex:1"></div>
        <!-- lang select -->
        <select class="lang-sel" id="langSel" onchange="changeLang(this.value)">
          <option value="0">🌐 ENG</option>
        </select>
        <!-- res -->
        <select class="rsel" id="rsel" onchange="changeRes(this.value)">
          <option value="-1">AUTO</option>
        </select>
        <!-- fullscreen -->
        <button class="cbtn" onclick="goFS()">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- match info bar -->
  <div class="ch-info-bar" id="infoBar">
    <div class="match-logo" id="matchLogos">
      <div class="team-logo" id="logo1">🏆</div>
    </div>
    <div class="ch-meta">
      <div class="ch-title" id="infoTitle">Pilih pertandingan untuk mulai menonton</div>
      <div class="ch-sub" id="infoSub">SportStream • Live Sports Streaming</div>
      <div class="tag-row" id="tagRow">
        <span class="tag hls">HLS.js • M3U8</span>
        <span class="tag cat">SportStream</span>
      </div>
    </div>
  </div>

</section>

<!-- ── SIDEBAR ── -->
<aside class="sidebar">
  <div class="sb-head">
    <div class="sb-title" id="sbTitle">📡 Memuat Jadwal...</div>
    <input class="sbox" type="text" placeholder="🔍 Cari pertandingan..." oninput="doSearch(this.value)">
  </div>
  <div class="ftabs" id="ftabs">
    <button class="ftab on" onclick="filterCat('all',this)">SEMUA</button>
  </div>
  <div class="ch-list" id="chList">
    <div class="loading-state">
      <div style="display:flex;flex-direction:column;align-items:center;gap:10px">
        <div class="spin" style="display:block;width:26px;height:26px"></div>
        MENGAMBIL DATA...
      </div>
    </div>
  </div>
</aside>

</div>

<!-- toast -->
<div class="toast" id="toast"></div>

<script>
// ════════════════════════════════════
// DATA SOURCE
// ════════════════════════════════════
const DATA_URL = 'https://raw.githubusercontent.com/Khofah567765/channel/main/full_matches_data.json';

// ════════════════════════════════════
// STATE
// ════════════════════════════════════
let allMatches = [];
let filtered   = [];
let current    = null;
let hls        = null;
let playing    = false;
let muted      = false;
let curStreams  = [];
let curFilter  = 'all';
let searchQ    = '';

const vid = document.getElementById('vid');

// ════════════════════════════════════
// FETCH DATA
// ════════════════════════════════════
async function loadData() {
  try {
    const res = await fetch(DATA_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    allMatches = Array.isArray(data) ? data : (data.matches || data.data || []);
    if (!allMatches.length) throw new Error('Empty data');
    init();
  } catch(e) {
    document.getElementById('sbTitle').textContent = '⚠️ Gagal memuat data';
    document.getElementById('chList').innerHTML =
      `<div class="empty">❌ Tidak bisa mengambil data:<br><small>${e.message}</small><br><br>
       <button onclick="loadData()" style="padding:6px 14px;background:var(--red);border:none;color:#fff;border-radius:3px;cursor:pointer;font-family:Barlow Condensed,sans-serif;font-weight:700">COBA LAGI</button></div>`;
  }
}

// ════════════════════════════════════
// INIT
// ════════════════════════════════════
function init() {
  const liveCount = allMatches.filter(m => m.is_live).length;
  document.getElementById('totalCount').textContent = allMatches.length;
  document.getElementById('sbTitle').textContent =
    `📡 ${allMatches.length} Pertandingan · ${liveCount} LIVE`;

  buildCatTabs();
  applyFilter();
}

// ════════════════════════════════════
// CATEGORY TABS
// ════════════════════════════════════
function buildCatTabs() {
  const cats = [...new Set(allMatches.map(m => m.category).filter(Boolean))].sort();
  const tabs = document.getElementById('ftabs');
  // remove old
  [...tabs.querySelectorAll('.ftab:not(:first-child)')].forEach(t => t.remove());
  cats.forEach(cat => {
    const b = document.createElement('button');
    b.className = 'ftab';
    b.textContent = cat.toUpperCase();
    b.onclick = () => filterCat(cat, b);
    tabs.appendChild(b);
  });
}

function filterCat(cat, el) {
  curFilter = cat;
  document.querySelectorAll('.ftab').forEach(t => t.classList.remove('on'));
  el.classList.add('on');
  applyFilter();
}

function doSearch(v) { searchQ = v.toLowerCase(); applyFilter(); }

function applyFilter() {
  filtered = allMatches.filter(m => {
    const okCat = curFilter === 'all' || m.category === curFilter;
    const q = searchQ;
    const okQ = !q || (m.title||'').toLowerCase().includes(q) ||
                (m.category||'').toLowerCase().includes(q);
    return okCat && okQ;
  });
  // sort: live first, then by time
  filtered.sort((a,b) => {
    if (a.is_live && !b.is_live) return -1;
    if (!a.is_live && b.is_live) return 1;
    return (a.waktu_wib||'').localeCompare(b.waktu_wib||'');
  });
  renderList();
}

// ════════════════════════════════════
// RENDER LIST
// ════════════════════════════════════
function catEmoji(cat) {
  if (!cat) return '🏆';
  const c = cat.toLowerCase();
  if (c.includes('football') || c.includes('soccer')) return '⚽';
  if (c.includes('basket')) return '🏀';
  if (c.includes('tennis')) return '🎾';
  if (c.includes('motor') || c.includes('formula') || c.includes('moto')) return '🏎️';
  if (c.includes('cricket')) return '🏏';
  if (c.includes('badminton')) return '🏸';
  if (c.includes('boxing') || c.includes('tinju') || c.includes('mma')) return '🥊';
  if (c.includes('volley') || c.includes('voli')) return '🏐';
  if (c.includes('golf')) return '⛳';
  if (c.includes('swim') || c.includes('renang')) return '🏊';
  if (c.includes('cycling') || c.includes('sepeda')) return '🚴';
  if (c.includes('rugby')) return '🏉';
  if (c.includes('baseball')) return '⚾';
  if (c.includes('hockey')) return '🏒';
  return '🏆';
}

function formatTanggal(tgl) {
  // "2026-06-08" → "08 Jun 2026"
  if (!tgl) return '';
  const [y,mo,d] = tgl.split('-');
  if (!y||!mo||!d) return tgl;
  const bulan = ['','Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  return `${d} ${bulan[+mo]||mo} ${y}`;
}

function parseTime(wib) {
  // "09-06-2026 01:45 WIB" → "01:45"
  if (!wib) return '';
  const parts = wib.split(' ');
  return parts[1] || '';
}

function renderList() {
  const list = document.getElementById('chList');
  if (!filtered.length) {
    list.innerHTML = '<div class="empty">Tidak ada pertandingan ditemukan</div>';
    return;
  }

  list.innerHTML = filtered.map(m => {
    const isOn = current?.id === m.id;
    const emoji = catEmoji(m.category);
    const timeStr = parseTime(m.waktu_wib);
    const tglStr  = formatTanggal(m.tanggal_pertandingan);

    // logos
    let logoHtml;
    if (m.logo_t1 && m.logo_t2) {
      logoHtml = `
        <div class="sm-logo"><img src="${m.logo_t1}" onerror="this.style.display='none'"></div>
        <span class="vs-sm">VS</span>
        <div class="sm-logo"><img src="${m.logo_t2}" onerror="this.style.display='none'"></div>`;
    } else if (m.category_image) {
      logoHtml = `<div class="sm-logo" style="width:44px;height:44px"><img src="${m.category_image}" onerror="this.innerHTML='${emoji}'"></div>`;
    } else {
      logoHtml = `<div class="sm-logo">${emoji}</div>`;
    }

    const liveHtml = m.is_live
      ? `<div class="live-ind"><div class="ld"></div>LIVE</div>`
      : `<div class="upcoming-lbl">🗓 Segera</div>`;

    return `<div class="ch-card${isOn?' on':''}" id="mc-${m.id}" onclick="selectMatch(${m.id})">
      <div class="ch-logos">${logoHtml}</div>
      <div class="ch-body">
        <div class="ch-name">${m.title}</div>
        <div class="ch-cat">${emoji} ${m.category||'Sport'}</div>
      </div>
      <div class="ch-right">
        <div class="ch-time">${timeStr}</div>
        ${tglStr ? `<div class="upcoming-lbl">${tglStr}</div>` : ''}
        ${liveHtml}
      </div>
    </div>`;
  }).join('');
}

// ════════════════════════════════════
// SELECT MATCH
// ════════════════════════════════════
function selectMatch(id) {
  const m = allMatches.find(x => x.id === id);
  if (!m) return;
  current = m;
  curStreams = m.streams || [];

  // sidebar highlight
  document.querySelectorAll('.ch-card').forEach(c => c.classList.remove('on'));
  document.getElementById('mc-'+id)?.classList.add('on');

  // update info bar
  updateInfoBar(m);

  // build lang selector
  buildLangSelect(curStreams);

  // show loading
  document.getElementById('phBtn').style.display = 'none';
  document.getElementById('spin').style.display = 'block';
  document.getElementById('phTxt').textContent = 'MEMUAT STREAM...';
  document.getElementById('ph').style.display = 'flex';
  document.getElementById('errOv').style.display = 'none';

  // load first stream
  const firstUrl = curStreams[0]?.m3u8 || '';
  if (firstUrl) {
    loadStream(firstUrl);
  } else {
    showErr('Tidak ada URL stream tersedia.');
  }
}

function updateInfoBar(m) {
  // logos
  const logos = document.getElementById('matchLogos');
  if (m.logo_t1 && m.logo_t2) {
    logos.innerHTML = `
      <div class="team-logo"><img src="${m.logo_t1}" onerror="this.style.display='none'"></div>
      <span class="vs-txt">VS</span>
      <div class="team-logo"><img src="${m.logo_t2}" onerror="this.style.display='none'"></div>`;
  } else if (m.category_image) {
    logos.innerHTML = `<div class="team-logo"><img src="${m.category_image}" onerror="this.innerHTML='${catEmoji(m.category)}'"></div>`;
  } else {
    logos.innerHTML = `<div class="team-logo">${catEmoji(m.category)}</div>`;
  }

  document.getElementById('infoTitle').textContent = m.title;

  const tglFmt = formatTanggal(m.tanggal_pertandingan);
  document.getElementById('infoSub').textContent =
    `${m.category||'Sport'} • ${tglFmt ? tglFmt + ' • ' : ''}${m.waktu_wib||''} • ${m.is_live ? '🔴 SEDANG LIVE' : '⏱ Segera'}`;

  const tagRow = document.getElementById('tagRow');
  const livePart = m.is_live ? '<span class="tag live">🔴 LIVE</span>' : '';
  const tglPart  = tglFmt ? `<span class="tag wib">📅 ${tglFmt}</span>` : '';
  const jamPart  = m.waktu_wib ? `<span class="tag wib">⏰ ${parseTime(m.waktu_wib)}</span>` : '';
  tagRow.innerHTML = `${livePart}<span class="tag cat">${m.category||'Sport'}</span><span class="tag hls">M3U8 / HLS</span>${tglPart}${jamPart}`;

  // active stream display
  document.getElementById('activeStream').textContent = (curStreams[0]?.m3u8 || '').slice(0,60) + '...';
}

function buildLangSelect(streams) {
  const sel = document.getElementById('langSel');
  sel.innerHTML = streams.map((s,i) =>
    `<option value="${i}">${s.lang || 'Stream '+(i+1)}</option>`
  ).join('');
}

// ════════════════════════════════════
// LOAD STREAM (HLS.js)
// ════════════════════════════════════
function loadStream(url) {
  if (hls) { hls.destroy(); hls = null; }

  document.getElementById('activeStream').textContent = url.slice(0,60)+'...';

  if (Hls.isSupported()) {
    hls = new Hls({ enableWorker:true, lowLatencyMode:true, maxBufferLength:30 });
    hls.loadSource(url);
    hls.attachMedia(vid);

    hls.on(Hls.Events.MANIFEST_PARSED, (_e, data) => {
      document.getElementById('ph').style.display = 'none';
      vid.volume = +document.getElementById('vs').value / 100;
      vid.play().catch(() => {
        document.getElementById('ph').style.display = 'flex';
        document.getElementById('spin').style.display = 'none';
        document.getElementById('phBtn').style.display = 'flex';
        document.getElementById('phTxt').textContent = 'KLIK ▶ UNTUK PUTAR';
      });
      playing = true; updatePP();

      // quality levels
      const rsel = document.getElementById('rsel');
      rsel.innerHTML = '<option value="-1">AUTO</option>';
      if (data.levels && data.levels.length > 1) {
        data.levels.forEach((lv,i) => {
          const o = document.createElement('option');
          o.value = i;
          o.textContent = lv.height ? lv.height+'p' : 'L'+(i+1);
          rsel.appendChild(o);
        });
      }
      toast('▶ ' + (current?.title || 'Stream') + ' dimulai');
    });

    hls.on(Hls.Events.ERROR, (_e, d) => {
      if (d.fatal) showErr(d.details || 'Stream error');
    });

  } else if (vid.canPlayType('application/vnd.apple.mpegurl')) {
    vid.src = url;
    vid.addEventListener('loadedmetadata', () => {
      document.getElementById('ph').style.display = 'none';
      vid.play(); playing = true; updatePP();
    }, {once:true});
    vid.addEventListener('error', () => showErr('Gagal di browser ini'), {once:true});
  } else {
    showErr('Browser tidak mendukung HLS');
  }
}

function playSelected() {
  if (current) {
    const url = curStreams[+document.getElementById('langSel').value]?.m3u8;
    if (url) loadStream(url);
  }
}

// ════════════════════════════════════
// CONTROLS
// ════════════════════════════════════
function togglePlay() {
  if (vid.paused) { vid.play(); playing=true; }
  else { vid.pause(); playing=false; }
  updatePP();
}

function updatePP() {
  document.getElementById('ppIco').innerHTML = playing
    ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
}

function toggleMute() {
  muted = !muted; vid.muted = muted;
  document.getElementById('volIco').innerHTML = muted
    ? '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>'
    : '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
}

function setVol(v) {
  vid.volume = v/100;
  if (+v===0) { muted=true; vid.muted=true; }
  else { muted=false; vid.muted=false; }
}

function changeLang(idx) {
  const url = curStreams[+idx]?.m3u8;
  if (url && current) loadStream(url);
}

function changeRes(v) {
  if (!hls) return;
  hls.currentLevel = +v;
  const label = document.getElementById('rsel').options[document.getElementById('rsel').selectedIndex]?.text;
  if (v !== '-1') toast('📺 Resolusi: ' + label);
}

function goFS() {
  const w = document.getElementById('pw');
  if (!document.fullscreenElement) w.requestFullscreen?.() || w.webkitRequestFullscreen?.();
  else document.exitFullscreen?.() || document.webkitExitFullscreen?.();
}

function seekVid(e) {
  const bar = e.currentTarget;
  const pct = (e.clientX - bar.getBoundingClientRect().left) / bar.offsetWidth;
  if (vid.duration > 0) vid.currentTime = pct * vid.duration;
}

function fmtTime(s) {
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return m+':'+sec.toString().padStart(2,'0');
}

setInterval(() => {
  if (vid.duration > 0) {
    document.getElementById('pf').style.width = (vid.currentTime/vid.duration*100)+'%';
    document.getElementById('timeTxt').textContent = fmtTime(vid.currentTime)+' / '+fmtTime(vid.duration);
  } else {
    document.getElementById('timeTxt').textContent = 'LIVE';
  }
}, 1000);

vid.addEventListener('play',  () => { playing=true;  updatePP(); });
vid.addEventListener('pause', () => { playing=false; updatePP(); });

// ════════════════════════════════════
// HELPERS
// ════════════════════════════════════
function showErr(msg) {
  document.getElementById('ph').style.display = 'none';
  const ov = document.getElementById('errOv');
  ov.style.display = 'flex';
  document.getElementById('errSub').textContent = msg;
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 3200);
}

function checkEME() {
  const ok = 'requestMediaKeySystemAccess' in navigator;
  document.getElementById('emeV').innerHTML =
    `<div class="sd${ok?'':' off'}"></div>${ok?'Tersedia':'Tidak Tersedia'}`;
}

// keyboard shortcuts
document.addEventListener('keydown', e => {
  if (['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)) return;
  if (e.code==='Space'){e.preventDefault();togglePlay();}
  if (e.code==='KeyM') toggleMute();
  if (e.code==='KeyF') goFS();
  if (e.code==='ArrowUp'){vid.volume=Math.min(1,vid.volume+.1);document.getElementById('vs').value=vid.volume*100;}
  if (e.code==='ArrowDown'){vid.volume=Math.max(0,vid.volume-.1);document.getElementById('vs').value=vid.volume*100;}
});

// ════════════════════════════════════
// START
// ════════════════════════════════════
loadData();
</script>
